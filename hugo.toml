baseURL = 'https://www.oceanheart.ai/'
languageCode = 'en-gb'
title = 'oceanheart.ai'

[params]
  description = "Richard Hallett builds dependable AI automations and customer systems for growing businesses, with particular experience in wellbeing, client delivery, and high-trust work."
  author = "Richard Hallett"
  email = "kai@oceanheart.ai"
  github = "https://github.com/rickhallett"
  linkedin = "https://www.linkedin.com/in/richardhallett86/"

[menus]
  [[menus.main]]
    name = 'work'
    url = '/projects/'
    weight = 10
  [[menus.main]]
    name = 'about'
    url = '/about/'
    weight = 20
  [[menus.main]]
    name = 'cv'
    url = '/cv/'
    weight = 30

  [[menus.footer]]
    name = 'notes'
    url = '/blog/'
    weight = 10
  [[menus.footer]]
    name = 'observatory'
    url = 'https://observatory-delta.vercel.app'
    weight = 20

[markup]
  [markup.highlight]
    style = 'tokyonight-night'
    lineNos = false
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats]
  [outputFormats.llms]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true

[outputs]
  home = ['HTML', 'RSS', 'llms']
  section = ['HTML', 'RSS']

[taxonomies]
  tag = 'tags'
  category = 'categories'

[pagination]
  pagerSize = 20
