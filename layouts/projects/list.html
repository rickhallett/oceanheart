{{ define "main" }}
<div class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="content">{{ . }}</div>{{ end }}
</div>

<section class="home-projects">
  {{ $projects := sort (where .Site.RegularPages "Type" "projects") "Params.weight" }}
  {{ range $i, $p := $projects }}
    {{ partial "project-card.html" (dict "page" $p "num" (add $i 1)) }}
  {{ end }}
</section>
{{ end }}
