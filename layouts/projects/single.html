{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>
    {{ with .Params.tags }}
    <div class="post-meta">
      {{ range . }}<span class="post-tag">{{ . }}</span> {{ end }}
    </div>
    {{ end }}
  </header>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
