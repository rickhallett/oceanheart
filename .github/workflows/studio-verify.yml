name: Studio verification

on:
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio-verify.yml"
  push:
    branches: [main, feat/oceanheart-studio]
    paths:
      - "studio/**"
      - ".github/workflows/studio-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio build and browser verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: studio-browser-evidence
          path: |
            studio/playwright-report/
            studio/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Studio backend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio/backend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:integration
