name: Studio bench verification

on:
  pull_request:
    paths:
      - "studio/bench/**"
      - ".github/workflows/studio-bench.yml"
  push:
    branches: [studio/dev]
    paths:
      - "studio/bench/**"
      - ".github/workflows/studio-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Studio bench synthetic verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio/bench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/bench/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
