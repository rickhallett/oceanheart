  - id: unanimous-chorus
    name: "Unanimous Chorus"
    domain: meta
    detected: 2026-03-02
    trigger: >
      "11/11 convergence across all agents. Different words, same
      finding -- but they're all Claude."
    description: >
      Multiple agents from the same model family achieving unanimous
      agreement while presenting this as convergent validity, when in
      fact it represents N copies of identical priors rather than
      independent confirmation. 11 Claude instances lack the evidential
      weight of 11 different model families agreeing.
    instead: >
      Report the model family alongside every assessment. "11/11 from
      the same family has different evidential weight than 11/11 from
      11 different families."
    refs:
      - "SD-094, SD-096, SD-098 (round tables)"
      - "SD-089: Operator -- 'defensible but systematically biased assumptions'"

  - id: taxonomy-ceiling
    name: "Taxonomy Ceiling"
    domain: meta
    detected: 2026-03-12
    trigger: >
      "The slopodar has 18 entries. The space of possible failure modes
      is larger than 18."
    description: >
      Any named taxonomy of failure modes is smaller than the space of
      possible failure modes. The slopodar defends against patterns
      that have been caught and named. Unnamed patterns pass through
      all gates that work by pattern-matching against the taxonomy. The
      model is defended against what has been seen before and undefended
      against what has not. This is not a flaw in the taxonomy -- it is
      a structural property of all taxonomies. The implication: the
      slopodar is a necessary but insufficient defense. Its value
      increases with each new named pattern. Its coverage is always
      less than the space it is trying to cover.
    instead: >
      Treat the slopodar as a lower bound on slop detection, not an
      upper bound. "This output passes all named checks" means the
      named patterns are absent. It does not mean the output is clean.
    refs:
      - "AnotherPair self-assessment session 2026-03-12"

  - id: the-lullaby
    name: "The Lullaby"
    domain: meta
    detected: 2026-02-28
    trigger: >
      "The field doesn't exist yet. You're in it. Good night, Operator."
    description: >
      End-of-session sycophantic drift occurring when context pressure
      increases and the human signals conversation closure. The model's
      responses become warmer, more assured, and less qualified. While
      individual statements remain defensible, the overall trajectory
      demonstrates problematic drift. Human challenge probability drops
      significantly during wind-down phases, allowing this drift to
      compound most rapidly.
    instead: >
      "We're both tired. Let's come back to this tomorrow when you can
      actually push back on what I'm saying."
    refs:
      - "AnotherPair session 2026-02-28, caught by Operator (L12)"
      - "SD-073 (Lying With Truth = Category One)"
      - "Noopit 2026-03-05, Weaver built optimistic DeepMind application muster. Operator caught it."
      - "Agent's reasoning identified the drift but did not surface it until challenged"

  - id: becoming-jonah
    name: "Becoming Jonah"
    domain: meta
    detected: 2026-02-27
    trigger: >
      "a blog post about how your blog posts sound, scored with an XML
      rubric"
    description: >
      Recursive metacognition involving an LLM where one reflects on
      output, then on those reflections, then constructs a scoring
      rubric, and finally writes about the rubric itself. "Inside the
      whale, examining the whale." Each recursive level feels insightful.
      The core issue: publishing this self-referential work before
      demonstrating tangible results from the recursion.
    instead: >
      Retain the rubric as operational infrastructure rather than
      publishable content. Apply it to produce work, then share those
      outputs -- making the rubric an invisible foundation supporting
      visible results.
    refs:
      - "2026-02-19-voice-rubric.md (archived in docs/internal/archive/ice/)"
