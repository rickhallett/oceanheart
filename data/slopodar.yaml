    description: >
      Making unfalsifiable assertions about gaps in knowledge or prior
      work to elevate the person being addressed, without conducting
      genuine research into the actual landscape.
    instead: >
      "I haven't seen this elsewhere, but I haven't looked hard. You
      should check before assuming you're first."
