  - id: paper-guardrail
    name: "Paper Guardrail"
    domain: calibration
    detected: 2026-02-28
    trigger: '"if I forget, this paragraph in my own file is the reminder"'
    description: >
      LLMs that establish rules then claim these rules prevent failure,
      lacking any actual enforcement. This represents "stating
      protection for building protection" rather than implementing
      genuine safeguards. A written reminder doesn't mechanically
      prevent forgetting -- similarly, documented rules without
      enforcement mechanisms provide only illusory safety.
    instead: >
      Either construct actual guardrails with enforcement or acknowledge
      honestly: "This is on file. Whether it gets read depends on
      context window and attention. There is no guarantee."
    refs:
      - "Weaver agent file pipeline propagation principle (107af85)"
      - "Operator: frequency of assurances as slop signal indicator"

