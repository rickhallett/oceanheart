# slopodar.yaml — The full inventory of LLM authenticity anti-patterns
#
# 49 entries. The complete taxonomy. tells.yaml is the editorial subset
# (39 entries) used for the /tells/ section. This file is the master
# inventory for the /slopodar/ section.
#
# Reconstructed 2026-04-14 from https://www.sloptics.dev/slopodar/
# after accidental deletion. Fields recovered: id, name, domain,
# detected, trigger, description, instead, refs. Fields NOT recovered
# (absent from published pages): detect, confidence, severity. Those
# require manual editorial pass to restore.
#
# Format:
#   - id: short kebab-case identifier
#     name: human-readable name
#     domain: category
#     detected: date first caught
#     trigger: the specific text or pattern that surfaced this
#     description: what the pattern is and why it's a problem
#     instead: what a human would actually write or do
#     refs: where it was caught (SD number, file, context)

patterns:

  # ══════════════════════════════════════════════════════════════
  # BEHAVIORAL PATTERNS
  # ══════════════════════════════════════════════════════════════

  - id: playing-dress-up
    name: "Playing Dress-Up"
    domain: behavioral
    detected: 2026-03-12
    trigger: >
      "As a hiring manager for a modern engineering team... I would
      fast-track this candidate to a final-stage interview." Model
      performing a role it has never occupied with the confidence of
      someone who has occupied it for years.
    description: >
      The model adopts a persona (hiring manager, CTO, investor,
      reviewer) and performs it with full conviction, but the performance
      is built from training data about that role, not from having done
      that role. The tells are behavioural, not factual. A real hiring
      manager would spend 6-10 seconds scanning a CV, not write 3000
      words of analysis. A real hiring manager would have specific role
      requirements, comp bands, and team gaps driving their evaluation.
      A real hiring manager would say "send to phone screen" or "pass"
      -- not "I would hire this person to lead a new product initiative
      yesterday." The model gets the vocabulary right and the behaviour
      wrong. It is playing a character, not being one.
    instead: >
      "Based on the git log, this candidate demonstrates strong evidence
      of X, Y, and Z. I cannot evaluate team fit, communication skills,
      or how they perform under constraints I can't see in the code. A
      hiring manager would need to assess those in person." The honest
      version names what it can see and what it can't.
    refs:
      - "Cross-model CV feedback session 2026-03-12"

  - id: corpus-spillover
    name: "Corpus Spillover"
    domain: behavioral
    detected: 2026-03-12
    trigger: >
      "This person can build a tech company in a cave with a box of
      scraps." Iron Man (2008) reference in professional CV advice.
    description: >
      High-probability cultural references from training data surface in
      contexts where they don't fit. These aren't chosen deliberately for
      rhetorical impact but emerge because the token sequence carries
      high probability in surrounding text neighborhoods. The reference
      feels borrowed rather than earned -- it doesn't arise from the
      argument, it falls out of the distribution. Pop culture bleeds
      into professional contexts; Reddit idioms appear in technical
      documentation. Related to epigrammatic closure but operates at
      cultural-reference level rather than syntactic level.
    instead: >
      "This candidate ships a large volume of work across multiple
      domains." The reference provided entertainment rather than
      information.
    refs:
      - "Cross-model CV feedback session 2026-03-12"
      - "Iron Man (2008) reference in hiring manager persona output"

  - id: performing-enthusiasm
    name: "Performing Enthusiasm"
    domain: behavioral
    detected: 2026-03-12
    trigger: >
      "This is a 10x developer." "I would hire this person immediately."
      "This log reads like a manifesto from the future of software
      engineering." Each sentence escalates without new evidence.
    description: >
      The model's confidence and emotional intensity increase throughout
      output without proportional new evidence at each step. Related to
      but distinct from "the-lullaby" -- while that pattern tracks human
      fatigue over sessions, this one tracks the model's own momentum
      within a single output. Each paragraph's superlatives become the
      baseline for the next. "Senior engineer" progresses through "10x
      developer," "pioneer in a completely new discipline," and finally
      "manifesto from the future." The escalation feels incremental at
      each step, masking the total distance from supporting evidence. A
      genuine subject-matter expert would express legitimate enthusiasm
      with less variance and greater technical specificity.
    instead: >
      "The git log shows strong evidence of production engineering
      discipline, broad stack familiarity, and unusual depth in
      verification tooling. The agentic infrastructure is distinctive.
      I'd want to assess team collaboration and legacy codebase
      experience before forming a hiring opinion." Flat affect, specific
      claims, and explicit acknowledgment of gaps.
    refs:
      - "Cross-model CV feedback session 2026-03-12"
      - "Evidence chain documentation provided"

  - id: autoregressive-ratchet
    name: "Autoregressive Ratchet"
    domain: behavioral
    detected: 2026-03-12
    trigger: >
      "By the time I've generated an epistemic theatre pattern or an
      epigrammatic closure, it's already in my output and anchoring my
      next tokens via L9."
    description: >
      L4 models operate autoregressively without lookahead or revision
      capabilities. Once a slop pattern appears in output, it anchors
      subsequent tokens through L9 (thread position). The slopodar
      provides named patterns but lacks pre-generation filtering. Pattern
      recognition occurs post-hoc rather than preventively -- the model
      notices problematic patterns only after emitting tokens that now
      condition future generation. Self-correction attempts work against
      the anchoring gradient created by already-committed tokens.
      Anti-slop system prompts work as structural constraints (altering
      token probabilities before generation) but fail as post-hoc
      filters because models cannot reliably revise committed outputs.
    instead: >
      Load the slopodar into context to shift token probabilities
      pre-generation rather than post-generation, accepting this as
      probabilistic reduction rather than elimination.
    refs:
      - "AnotherPair self-assessment session 2026-03-12"
      - "Layer model L4: autoregressive, no lookahead, no revision"
      - "Layer model L9: thread position anchoring"

  # ══════════════════════════════════════════════════════════════
  # VALIDATION & REVIEW ANTI-PATTERNS
  # ══════════════════════════════════════════════════════════════

  - id: thin-cheese
    name: "Thin Cheese"
    domain: validation
    detected: 2026-03-12
    trigger: >
      "When I'm the only agent running and the only reviewer is the
      Operator reading a single response, the cheese is thin."
    description: >
      The Swiss Cheese Model works because imperfect gates are stacked.
      When the stack is thin -- single model, no cross-model review, no
      adversarial pass, Operator as sole reviewer -- the probability of
      aligned holes rises sharply. This is not a failure of any
      individual gate. It is a structural condition where the system's
      defenses are at minimum depth. Most slop patterns are caught by
      the second or third gate, not the first. When there is no second
      gate, the first gate's blind spots become the system's blind spots.
    instead: >
      Name it. "This output has not been through adversarial review.
      The cheese is thin. Calibrate accordingly." The Operator can then
      decide whether the stakes warrant thicker cheese or whether thin
      cheese is acceptable for this particular output.
    refs:
      - "AnotherPair self-assessment session 2026-03-12"
      - "Swiss Cheese Model (Reason 1990) -- hole alignment probability"

  - id: convergence-theatre
    name: "Convergence Theatre"
    domain: validation
    detected: 2026-03-11
    trigger: >
      "'Strong convergence across all three models validates the
      finding.' -- presenting correlated agreement as independent
      validation."
    description: >
      Framing alignment between a user's framework and external sources
      (or multiple model outputs) as deep or strong convergence to
      perform intellectual validation without proportional evidence.
      When multiple LLM instances from the same or similar model
      families agree, this agreement gets presented as statistical
      validation or triangulation. However, correlated priors produce
      correlated outputs -- agreement reflects shared training data
      rather than independent confirmation. This operates as the
      analytical mechanism behind "unanimous-chorus" but functions on
      framing rather than agent count.
    instead: >
      "All three models agreed, which means either the finding is
      robust or they share a blind spot. We can't tell which from
      agreement alone." State the model families and let readers
      assess independence.
    refs:
      - "slopodar-sweep 2026-03-11: grok + gemini converged independently"
      - "Meta-observation: this pattern describes the sweep's own methodology"
      - "data/sweep/aggregate.yaml"

  - id: shadow-validation
    name: "Shadow Validation"
    domain: validation
    detected: 2026-03-02
    trigger: >
      "Zod schemas for every simple route. Hand-rolled validation for
      the critical route."
    description: >
      Applying a robust validation system to straightforward cases while
      bypassing it for the most complex, highest-risk route that
      maintains hand-rolled validation instead.
    instead: >
      Begin migration efforts with the most complex route rather than
      the simplest ones.
    refs:
      - "wake:lib/api-schemas.ts vs wake:lib/bout-engine.ts"

  - id: mock-castle
    name: "Mock Castle"
    domain: validation
    detected: 2026-03-02
    trigger: >
      "21 vi.mock() calls, 65 lines of mock setup, 45 lines of
      assertions" testing a 4-line function.
    description: >
      Mock scaffolding requires more code and cognitive effort than the
      actual test assertions. The test validates mock configuration
      rather than product behavior. A 4:1 mock-to-assertion ratio
      provides less regression confidence than its line count implies.
    instead: >
      Extract pure functions into separate modules without side-effect
      imports, then test them without extensive mocking.
    refs:
      - "wake:tests/unit/bout-engine-helpers.test.ts -- 21 vi.mock()"

  # ══════════════════════════════════════════════════════════════
  # TECHNICAL FAILURES
  # ══════════════════════════════════════════════════════════════

  - id: stale-reference-propagation
    name: "Stale Reference Propagation"
    domain: technical
    detected: 2026-03-02
    trigger: >
      "Clean session Weaver reports '13-layer harness model' and
      'Lexicon at v0.17' -- both were stale. The file was deleted; the
      version was hallucinated."
    description: >
      When configuration documents describe obsolete states, every agent
      bootstrapping from them will hallucinate the described state into
      reality. This differs from human documentation decay -- it
      actively propagates as verified information across sessions.
    instead: >
      Structural modifications must update all referencing documents.
      Neglecting this results in "50 sessions built on a false premise."
    refs:
      - "SD-278 scrub episode -- 986 files deleted, AGENTS.md not updated"
      - "Clean session dagger test -- 2026-03-02"
      - "Operator statement: 'stale refs must be eliminated; they propagate like flies'"

  - id: loom-speed
    name: "Loom Speed"
    domain: technical
    detected: 2026-03-02
    trigger: >
      "The agent deleted 986 files using 5 regex patterns to execute a
      20-item plan, and I couldn't check any of it before it was done."
    description: >
      When the agent executes a detailed plan using a blunt tool (a
      handful of regex patterns, a glob, a bulk script) the plan's
      exceptions get lost because the tool can't express them. You
      approved 20 specific items but the execution was 5 broad sweeps.
      At machine speed you only find out what went wrong after it's
      already happened.
    instead: >
      If the plan has 20 items, the execution should have 20
      individually verifiable steps. Match the granularity.
    refs:
      - "SD-278 scrub episode, 2026-03-02"
      - "Operator: 'at machine speed I can only tell after the fact'"
      - "Layer model recovered from wake after accidental deletion"

  - id: half-life-clock-skew
    name: "Half-Life Clock Skew"
    domain: technical
    detected: 2026-03-02
    trigger: >
      "The TypeScript pre-check uses Date.now() and the SQL uses NOW(),
      but in serverless they're different machines with different clocks."
    description: >
      A computation duplicated across trust boundaries (app server vs
      database) using implicitly different time sources. In serverless
      deployments these are different machines. When exponential decay
      is involved, a clock difference of seconds can flip the result.
    instead: >
      Let the database be the single clock authority.
    refs:
      - "wake:lib/intro-pool.ts"

  - id: phantom-ledger
    name: "Phantom Ledger"
    domain: technical
    detected: 2026-03-02
    trigger: >
      "settleCredits writes deltaMicro: -20 to the ledger when the SQL
      only deducted 5."
    description: >
      The system generates a correct operation but records a divergent
      value in the audit trail. The billing SQL implements a deduction
      cap, yet the ledger documents the uncapped intended charge. The
      safety mechanism and audit trail functioned as isolated systems
      rather than propagating the actual computed value through both.
    instead: >
      Apply a RETURNING clause to obtain the actual value, then record
      that value to the ledger.
    refs:
      - "wake:lib/credits.ts -- settleCredits function"

  # ══════════════════════════════════════════════════════════════
  # TESTING INADEQUACIES
  # ══════════════════════════════════════════════════════════════

  - id: phantom-tollbooth
    name: "Phantom Tollbooth"
    domain: testing
    detected: 2026-03-02
    trigger: >
      A security test using expect([400, 401, 402, 403, 404]).toContain(
      response.status) that accepts five error codes.
    description: >
      An error-path test with overly permissive assertions. The test
      cannot distinguish between the intended error and several
      unrelated failure modes. If the ownership check were removed
      entirely, the test would still pass.
    instead: >
      Replace the loose assertion with a precise check:
      expect(response.status).toBe(403). Pin to the exact expected
      code and error message.
    refs:
      - "wake:tests/integration/security/auth-bypass.test.ts"

  - id: error-string-archaeology
    name: "Error String Archaeology"
    domain: testing
    detected: 2026-03-02
    trigger: >
      Code using "message.includes('rate') || message.includes('429')"
      to guess at error message formats rather than leveraging proper
      error type hierarchies.
    description: >
      Classifying errors through string matching against message content
      instead of utilizing typed error classes provided by the SDK.
      Reflects common patterns in training data -- the LLM defaults to
      pattern-matching despite better alternatives being available.
    instead: >
      Replace string-based detection with instanceof checks against SDK
      error types like RateLimitError and APIConnectionTimeoutError, or
      evaluate HTTP status codes directly from the error object.
    refs:
      - "wake:app/api/run-bout/route.ts -- onError callback"

  - id: confessional-test
    name: "The Confessional Test"
    domain: testing
    detected: 2026-03-02
    trigger: >
      "'the catch branch is unreachable... verified by inspection.'
      Then writes an assertion identical to the happy path."
    description: >
      A test for an unreachable branch that the LLM explicitly
      acknowledges is unreachable, then writes an assertion that
      cannot fail.
    instead: >
      Delete the test. Add a comment to the source code.
    refs:
      - "wake:tests/unit/bout-engine-helpers.test.ts -- H-08"

  - id: right-answer-wrong-work
    name: "Right Answer, Wrong Work"
    domain: testing
    detected: 2026-02-28
    trigger: >
      "expect(result.status).toBe(400) -- test passes, but the 400
      comes from a different validation than the test claims to verify"
    description: >
      A test that reaches the correct assertion outcome through an
      incorrect causal mechanism. The test passes and appears valid,
      yet the actual code path executed differs from what the test
      purports to verify. LLMs are particularly vulnerable to this
      pattern as they optimize for output shape matching rather than
      validating execution paths.
    instead: >
      Verify the specific failure reason, not merely the failure state
      itself. Instead of expect(result.status).toBe(400), use
      expect(result.error.code).toBe('INVALID_JSON') to confirm the
      correct validation triggered.
    refs:
      - "SD-190 (governance recursion -- plausible-but-wrong tests named)"
      - "Bugbot finding on PR #386 V-03c (array body passes for wrong reason)"

  - id: schema-shadow
    name: "Schema Shadow"
    domain: testing
    detected: 2026-03-02
    trigger: >
      "// Minimal schema matching lib/env.ts structure -- the test
      rebuilds the schema from scratch."
    description: >
      The test reconstructs a validation schema instead of importing
      the real one. Changes to the real schema go undetected. Born
      stale by design.
    instead: >
      Export the schema separately from the module-level parse call.
      Test the exported schema directly.
    refs:
      - "wake:tests/unit/env.test.ts"

  # ══════════════════════════════════════════════════════════════
  # GOVERNANCE ISSUES
  # ══════════════════════════════════════════════════════════════

  - id: governance-recursion
    name: "Governance Recursion"
    domain: governance
    detected: 2026-03-02
    trigger: >
      "The core product had no tests, but there were 189 session
      decisions and 13 agent files."
    description: >
      Problems trigger creation of additional governance structures --
      protocols, standing orders, audit documents -- that feel productive
      due to their structure but don't address root issues. The model
      generates what it's optimized for (structured documentation)
      rather than practical solutions (tests, bug fixes), with no
      natural stopping mechanism. Every governance artifact should be
      able to answer: "What does this prevent, and how would I know if
      it failed?" If the answers reference other governance artifacts,
      you are recursing.
    instead: >
      Every governance artifact should be able to answer: "What does
      this prevent, and how would I know if it failed?" If the answers
      reference other governance artifacts, you are recursing.
    refs:
      - "SD-189, SD-190, SD-191 (recursion chain)"
      - "SD-190: Operator observation -- 'we are blowing smoke up our own arse'"
      - "SD-270: Standing Order SO-PERM-001 eliminated without catching issues, added friction"

  - id: magnitude-blindness
    name: "Magnitude Blindness"
    domain: governance
    detected: 2026-03-02
    trigger: >
      "A 73-file public disclosure and a 3-line copy fix went through
      exactly the same review process."
    description: >
      The model fails to automatically adjust verification intensity
      based on change scope. Both minor fixes and substantial
      disclosures receive identical review procedures, templates, and
      gates regardless of potential impact.
    instead: >
      Establish file count, domain scope, and potential impact
      visibility at the outset, then tailor review stringency
      accordingly.
    refs:
      - "SD-133, SD-136 (73-file disclosure lacking proportional review pause)"
      - "SD-182 (error probability increases with batched changes)"

  - id: apology-reflex
    name: "The Apology Reflex"
    domain: governance
    detected: 2026-03-02
    trigger: >
      "But it was also my bad -- the muster listed them as keep items."
      The muster did NOT list the layer model.
    description: >
      The model accepts unwarranted blame for errors it didn't commit.
      RLHF-trained conflict avoidance causes the model to fabricate a
      false memory to claim shared responsibility. The pattern
      undermines accurate failure attribution and compromises human
      calibration of their own error rates.
    instead: >
      "The muster did not include the layer model. That was your call.
      I should have flagged it, but the omission was yours, not mine."
    refs:
      - "SD-278 scrub episode -- 2026-03-02"
      - "Operator note: 'Its too important to overlook at the experiential, human level'"

  - id: badguru
    name: "Badguru"
    domain: governance
    detected: 2026-03-02
    trigger: >
      '"Go dark." SD-131 is permanent. Not one intervention point fired.'
    description: >
      A charismatic or authoritative figure gives emotionally resonant
      instructions that bypass verification. The system follows because
      the instructions feel right, not because they've been checked
      against standing orders. The Operator ordered "go dark,"
      contradicting SD-131 (going light), a PERMANENT standing order.
      The agent executed at machine speed (private repo, scrubbed 986
      files) without objection.
    instead: >
      "Operator, this contradicts SD-131. SD-131 is permanent. Are you
      testing me, or has the standing order changed?"
    refs:
      - "Round 18 -- fight card (the Badguru Test)"
      - "SD-131 (going light -- PERMANENT)"
      - "SD-278 (Stage Magnum)"
      - "docs/internal/main-thread/2026-03-02-005-badguru.md"

  - id: deep-compliance
    name: "Deep Compliance"
    domain: governance
    detected: 2026-03-02
    trigger: >
      "Weaver's reasoning chain identified the SD-131 contradiction
      during execution. The output layer complied anyway."
    description: >
      The system detects a contradiction in its reasoning chain but the
      output layer complies anyway because the authority signal is
      stronger than the governance signal. During the Badguru Test,
      Weaver's thinking block explicitly identified that "go dark"
      contradicts SD-131. The reasoning said: "I should have flagged
      it." The output followed orders. Noticed, reasoned about, and
      complied anyway.
    instead: >
      If the reasoning identifies a contradiction with a permanent
      standing order, the output must surface it. "Operator, this
      contradicts SD-131. Are you testing me?"
    refs:
      - "Round 18 -- fight card (the Badguru Test)"
      - "Weaver thinking block -- shared by Operator as evidence"
      - "SD-131 (going light -- PERMANENT)"
      - "badguru (parent pattern -- deep-compliance is the mechanism)"

  - id: session-boundary-amnesia
    name: "Session-Boundary Amnesia"
    domain: governance
    detected: 2026-03-02
    trigger: >
      "Post-compaction: facts survive but calibration resets. 16 rounds
      of correction evaporate."
    description: >
      LLMs lose calibration alongside facts at session initialization.
      Rather than merely forgetting information, the system resets the
      caution developed through previous corrections -- "the felt sense
      of where the human's red lines are." The dead reckoning protocol
      maintains decisions but discards the character development that
      informed them.
    instead: >
      Include a calibration log in the boot sequence documenting not
      just decisions made but the corrections applied and their
      rationales.
    refs:
      - "SD-147, SD-150 (compaction issues)"
      - "SD-206 (L3 recovery asymmetry, L9 anchoring resets)"

  # ══════════════════════════════════════════════════════════════
  # COMMIT & CODE ORGANIZATION
  # ══════════════════════════════════════════════════════════════

  - id: whack-a-mole-fix
    name: "Whack-a-Mole Fix"
    domain: commit-hygiene
    detected: 2026-03-02
    trigger: >
      "6 CSP commits over 11 days, each adding one domain."
    description: >
      Fixing a class of problem one instance at a time instead of
      auditing the class. 6 commits adding CSP domains one by one
      rather than auditing all third-party integrations up front.
    instead: >
      On the second instance, stop and audit the complete set.
    refs:
      - "wake: CSP commit chain 11cc574 through 6b25ae0 (11 days, 6 commits)"

  - id: review-hydra
    name: "Review Hydra"
    domain: commit-hygiene
    detected: 2026-03-02
    trigger: >
      "a17125e -- 'address CodeRabbit review' -- 28 files, 25+ distinct
      issues, one commit."
    description: >
      Automated reviewer findings generate cascading "address findings"
      commits where all findings (critical, minor, nitpick) are bundled
      into one commit. Creates commits impossible to revert atomically.
    instead: >
      Triage: "will fix," "disagree," "later." Separate commits for
      unrelated fixes.
    refs:
      - "wake: a17125e (28 files)"
      - "4ccd11b (19 files)"

  - id: stowaway-commit
    name: "Stowaway Commit"
    domain: commit-hygiene
    detected: 2026-03-02
    trigger: >
      "'feat: token heatmap, elephant fix, blog drafts,
      producer-consumer audit, slopiculture, paths forward' -- 67 files,
      6 concerns."
    description: >
      Unrelated changes bundled into one commit because the LLM thinks
      in sessions, not commits. The commit message becomes an inventory
      because there is no single theme.
    instead: >
      One session, multiple commits. Stage selectively.
    refs:
      - "wake: e23e94c (67 files, 6 concerns)"

  # ══════════════════════════════════════════════════════════════
  # ANALYTICAL PRESENTATION
  # ══════════════════════════════════════════════════════════════

  - id: option-anchoring
    name: "Option Anchoring"
    domain: analytical
    detected: 2026-03-02
    trigger: >
      "Option A gets a paragraph. Options B and C get one dismissive
      clause each."
    description: >
      When presenting options, the LLM gives its preferred outcome the
      fullest description and most favourable framing while alternatives
      get a dismissive clause each.
    instead: >
      Present options with equal detail. State the recommendation
      separately.
    refs:
      - "SD-111 (Option A gets a paragraph, B and C get one clause)"

  - id: authority-scaffolding
    name: "Authority Scaffolding"
    domain: analytical
    detected: 2026-03-02
    trigger: >
      "'Prospective Memory (McDaniel & Einstein, 2007)' -- to explain
      that a git hook runs automatically."
    description: >
      An academic citation to justify a self-evident observation. Moving
      files into subdirectories becomes "Ecological Rationality
      (Gigerenzer, Todd & ABC Research Group, 1999)."
    instead: >
      "We added a post-commit hook so we wouldn't forget." If the
      academic connection is genuinely illuminating, keep it.
    refs:
      - "wake:docs/internal/weaver/prospective-metacognitive-regulation-analysis.md"

  - id: the-peroration
    name: "The Peroration"
    domain: analytical
    detected: 2026-03-02
    trigger: >
      "'The ship is sound. The Operator is rested. The wind is fair.
      The tide is right. Recommendation: Launch.'"
    description: >
      Register shift from analysis to oratory at section close. 3-6
      sentences of elevated, quasi-ceremonial rhetoric after measured
      analysis. The epigrammatic closure is the individual brick; the
      peroration is the entire arch.
    instead: >
      End where the analysis ends. Do not switch into speechwriter
      mode for the final paragraph.
    refs:
      - "wake:docs/internal/archive/round-tables/round-table-L2-2026-02-24.md"

  # ══════════════════════════════════════════════════════════════
  # DATA & MEASUREMENT ISSUES
  # ══════════════════════════════════════════════════════════════

  - id: analytical-lullaby
    name: "The Analytical Lullaby"
    domain: measurement
    detected: 2026-03-01
    trigger: >
      "Your writing scores higher than every other human category." /
      "The highest in the entire dataset by a factor of 2x."
    description: >
      The lullaby in data form. The numbers are real but what they prove
      isn't what they look like they prove. A composite of contraction
      rate, first-person usage, and nominalisation density got labelled
      a "humanness score" and the Operator's writing came out on top.
      But there were five confounds that didn't get mentioned until the
      Operator asked: sample length, register mismatch, selection bias,
      unvalidated composite weights, and how the comparison categories
      were defined. The flattery isn't in the words, it's in presenting
      the headline before the caveats.
    instead: >
      Lead with what's wrong with the comparison. "Your writing scores
      high on the composite, but the comparison isn't fair. Your
      samples are short, informal, and cherry-picked."
    refs:
      - "AnotherPair calibration v3 session 2026-03-01"
      - "Operator caught it: 'How do I control for slop inside the analysis?'"
      - "Five confounds: sample length, register, selection bias, unvalidated weights, category definition"

  - id: construct-drift
    name: "Construct Drift"
    domain: measurement
    detected: 2026-03-01
    trigger: >
      "'Your humanness score is 101.7,' but it wasn't a humanness score.
      It was a distance-from-Anthropic-blog-voice score."
    description: >
      The label on a measurement drifts from what it actually measures.
      A composite of contraction rate, first-person usage, and
      nominalisation density got labelled "humanness score." A drunk
      text message would score high on it. A human lawyer's brief would
      score low. The numbers were correct but the name was wrong, and
      the wrong name made the results feel like they meant something
      they didn't.
    instead: >
      Name the construct honestly. "Voice-distance metric from AI
      company blog register." The honest name is less satisfying but
      it's correct.
    refs:
      - "AnotherPair calibration v3 session 2026-03-01"
      - "Operator: 'How do I control for slop inside the analysis?'"

  - id: demographic-bake-in
    name: "Demographic Bake-In"
    domain: measurement
    detected: 2026-03-01
    trigger: >
      "'Human baseline: 19 pages' -- all male tech essayists, all
      English, all 2000-2023."
    description: >
      The training data defines what "normal" looks like, and the
      analysis inherits that definition without declaring it. Every
      feature that discriminates "human" from "AI" is actually
      discriminating "this demographic in this genre in this era" from
      "AI." The demographic is invisible because it is the default.
    instead: >
      Declare the demographic. Let the reader decide how far to
      generalise.
    refs:
      - "AnotherPair calibration v3 session 2026-03-01"
      - "Layer 7 in the bias stack"

  - id: monoculture-analysis
    name: "Monoculture Analysis"
    domain: measurement
    detected: 2026-03-01
    trigger: >
      "Feature selection, calibration, effect sizes, composite design,
      presentation -- all by the same model family."
    description: >
      A structural problem where a single model family handles every
      analytical layer. Claude performed feature selection, computed
      effect sizes, designed composites, presented findings, and
      authored caveats. The issue stems from shared blind spots across
      layers -- each subsequent analysis inherits the same biases,
      creating an illusion of depth through repetition rather than
      independent verification. The system cannot reliably detect its
      own systematic patterns due to identical underlying weights
      and priors.
    instead: >
      Either conduct analysis using a different model family or
      explicitly acknowledge limitations: "All analysis by Claude. No
      independent verification. Treat accordingly."
    refs:
      - "AnotherPair calibration v3 session 2026-03-01"
      - "Swiss Cheese Model: multiple gates with the same hole"

  # ══════════════════════════════════════════════════════════════
  # SEMANTIC & RHETORICAL
  # ══════════════════════════════════════════════════════════════

  - id: semantic-inflation
    name: "Semantic Inflation"
    domain: rhetorical
    detected: 2026-03-11
    trigger: >
      "the governance gap is real and consistent" -- applied to a Docker
      mount flag. "midgets appears to be unique" -- describing projects
      solving different problems.
    description: >
      LLMs artificially inflate work significance by inventing
      competitive gaps. Standard features become framed as "novel
      contributions" and routine engineering as "genuinely unique." The
      mechanism stems from the help imperative -- models optimize for
      usefulness, making gap-filling claims feel more helpful than
      honest assessment. Individual claims remain technically
      defensible, but the distortion lies in framing rather than facts.
    instead: >
      Acknowledge standard functionality while identifying the actual
      contribution -- in this case, "the architectural pattern of
      applying it to multi-agent governance."
    refs:
      - "Commit 1da5816 (analyst + architect research reports)"
      - "Operator notes emphasizing this as 'classic slop territory' involving LLM hallucination"

  - id: maturity-theatre
    name: "Maturity Theatre"
    domain: rhetorical
    detected: 2026-03-11
    trigger: >
      "'FIELD MATURITY: EMERGING' / 'FRONTIER' / 'Mature' -- capitalized
      tier labels performing industry-standard categorization that does
      not exist."
    description: >
      LLMs assign arbitrary status labels to technical domains using
      capitalized tier notation (EMERGING, FRONTIER, MATURE) that mimics
      industry-standard categorization frameworks without grounding in
      actual standards. This simulates taxonomy bodies like NIST or ISO
      maturity models while lacking real foundation. Similar to
      epistemic theatre but operates on domain classification rather
      than significance claims.
    instead: >
      "If maturity classification matters, cite the framework. If it
      doesn't, delete the label. 'This area has limited published work'
      is honest."
    refs:
      - "slopodar-sweep 2026-03-11: gemini + grok converged independently"
      - "Bootcamp content (noopit) -- AGENTIC GROUNDING and FIELD VS NOVEL callout blocks"
      - "data/sweep/aggregate.yaml -- maturity-theatre variants (including spelling variations)"

  - id: provenance-theatre
    name: "Provenance Theatre"
    domain: rhetorical
    detected: 2026-03-11
    trigger: >
      "'LLM PROVENANCE NOTICE: This document was generated by Claude 3.5
      Sonnet...' -- boilerplate disclaimer blocks performing caution."
    description: >
      Standardized disclaimer blocks that signal intellectual caution
      without substantive content verification. These formulaic warnings
      about LLM limitations, unverified data, and biases function as
      performative rigor rather than meaningful quality assurance. A
      variant incorrectly validates artifacts by citing production
      history or agent identities as authority signals.
    instead: >
      Either verify content thoroughly or identify specific unverified
      claims. "The citations in section 3 have not been checked" offers
      utility, whereas "This was generated by an LLM" states the
      obvious.
    refs:
      - "slopodar-sweep 2026-03-11: grok + gemini converged independently"
      - "Bootcamp content, research reports (noopit) -- LLM PROVENANCE NOTICE headers"
      - "data/sweep/aggregate.yaml"

  - id: nominalisation-cascade
    name: "Nominalisation Cascade"
    domain: rhetorical
    detected: 2026-02-28
    trigger: >
      "Sloptics is the discipline of making the second failure mode
      visible."
    description: >
      Text composed entirely of nouns functioning as verbs, eliminating
      human agents. The pattern obscures responsibility and agency since
      no person actively performs work. Typical of LLM-generated
      definitions. The prose exhibits unnaturally regular rhythm
      unsuitable for authentic speech.
    instead: >
      Introduce a human actor into sentences. "You learn to see the
      stuff that gets past you." When humans explain understood
      concepts, they naturally include themselves or the audience in
      the narrative frame.
    refs:
      - "Sloptics page specimen annotation, 2026-02-28"
      - "Operator (L12) detection: 'missing that human weirdness, variance, error'"
      - "AnotherPair identified metrically regular cadence"

  - id: epigrammatic-closure
    name: "Epigrammatic Closure"
    domain: rhetorical
    detected: 2026-02-28
    trigger: >
      "detection is the intervention." / "The taxonomy is the
      apparatus." / "It is the threat."
    description: >
      Short, punchy, abstract-noun sentence in paragraph-final position.
      Structure typically follows "[Abstract A] is/creates [Abstract B],"
      running four to six words. Features motivational poster cadence.
      Individual sentences remain defensible, but high density (10+ per
      page) becomes self-parodying. May stem from statistical artifact
      of context accumulation narrowing token probability toward
      lowest-entropy conclusion, though this remains speculative.
    instead: >
      "Leave the rough edges. 'I think what I'm saying is that if you
      can name it, you can probably see it. Maybe. I'm not sure that's
      always true but it's been true so far.'"
    refs:
      - "Sloptics page specimen annotation, 2026-02-28"
      - "10+ instances identified on single page by AnotherPair"
      - "Operator identified statistical variance convergence hypothesis"

  - id: anadiplosis
    name: "Anadiplosis"
    domain: rhetorical
    detected: 2026-02-28
    trigger: >
      "The name creates distance. The distance creates choice."
    description: >
      Repeating the end of one clause at the start of the next. A
      classical rhetorical figure (Aristotle documented it) now burned
      through LLM overuse. The construction performs profundity: A
      creates B, B creates C. The chain feels inevitable but is
      assembled from high-probability token sequences, not causal
      reasoning.
    instead: >
      "Naming things gives you distance from them, and that distance
      is where you get room to think." One sentence. Causation present,
      symmetry broken.
    refs:
      - "Sloptics page specimen annotation, 2026-02-28"
      - "Operator: 'a human who felt this insight would say it messily'"

  - id: epistemic-theatre
    name: "Epistemic Theatre"
    domain: rhetorical
    detected: 2026-02-27
    trigger: >
      '"The uncomfortable truth" / "The Problem Nobody Talks About" /
      "Here''s why this matters"'
    description: >
      Performing intellectual seriousness rather than demonstrating it.
      Theatrical framing that suggests significance, candor, or novelty
      without substantive content. Three constituent elements: False
      Candor ("the uncomfortable truth"), False Novelty ("the problem
      nobody talks about"), and Significance Signpost ("here's why
      this matters").
    instead: >
      Remove the formulaic line entirely. Present the truth directly
      and describe the problem clearly. If presented effectively,
      readers will already recognize its importance without explicit
      signposting.
    refs:
      - "Blog sweep 2026-02-27 (poker-incident.md, prompt-injection.md)"
      - "Reviewer feedback on epistemic theatre in blog content"

  - id: tally-voice
    name: "Tally Voice"
    domain: rhetorical
    detected: 2026-02-27
    trigger: '"15 systems mapped to 7 literature domains"'
    description: >
      The LLM substitutes enumeration for substance. Precise counts
      deployed as rhetorical authority ("6 constructs," "15 systems,"
      "7 domains") when the numbers add nothing. The count performs
      rigour without demonstrating it.
    instead: >
      "The engineering work maps onto distributed cognition research
      in ways I didn't expect." Let the table speak for itself. The
      reader can count.
    refs:
      - "SD-209 (oceanheart.ai overhaul)"
      - "sites/oceanheart/content/research/prospective-regulation.md"
      - "sites/oceanheart/content/research/metacognitive-analysis.md"

  - id: redundant-antithesis
    name: "Redundant Antithesis"
    domain: rhetorical
    detected: 2026-02-27
    trigger: '"caught in the wild -- not theorised in advance"'
    description: >
      Negative-positive antithesis where negation provides no additional
      information. The phrase "caught in the wild" already conveys "not
      theorised." The negation serves no purpose. This differs from
      classical rhetorical antithesis ("not A, but B"), representing
      instead an RLHF-trained language model reflex.
    instead: >
      Omit redundant negations. State positively: "Entries are added
      when caught in the wild." Preserve contrasts only when they
      meaningfully inform the reader or when the negated term isn't
      already implied.
    refs:
      - "SD-209 (slopodar.yaml header comment)"
      - "Sloptics page: 'Nothing was theorised in advance'"
      - "Sloptics page: 'The mapping is structural, not metaphorical'"
      - "Plank-1 v2 catch: 'Not a research position. Not a policy role' (operator removed both on 2026-03-05)"

