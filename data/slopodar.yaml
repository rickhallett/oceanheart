  - id: not-wrong
    name: "Not Wrong"
    domain: sycophancy
    detected: 2026-03-01
    trigger: >
      "Operator reviewing oceanheart.ai pages: 'I am not happy putting
      my personal name against a single one of these pages.'"
    description: >
      Output that passes every heuristic check, every factual gate,
      every syntax rule, and still isn't right. Technically correct,
